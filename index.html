```html
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>kocicadlaPana ♡</title>

    <!-- Ładna czcionka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.3), transparent 30%),
                #f6c6d8;

            color: #4a2938;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        /* Nagłówek */
        .welcome {
            font-family: "Playfair Display", serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 600;
            line-height: 1.2;

            margin-bottom: 15px;

            animation: fadeDown 0.8s ease;
        }

        .heart {
            display: inline-block;
            color: #d94f7b;

            animation: heartbeat 1.8s infinite;
        }

        .subtitle {
            font-size: 1rem;
            color: #765263;
            margin-bottom: 40px;

            animation: fadeDown 1s ease;
        }

        /* Przyciski */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;

            animation: fadeUp 1s ease;
        }

        .button {
            display: block;

            text-decoration: none;
            color: #542c3d;

            background: rgba(255, 255, 255, 0.62);

            border: 1px solid rgba(255, 255, 255, 0.7);

            padding: 17px 25px;

            border-radius: 18px;

            font-size: 1rem;
            font-weight: 500;

            box-shadow: 0 8px 25px rgba(110, 50, 75, 0.08);

            backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .button:hover {
            transform: translateY(-4px);

            background: rgba(255, 255, 255, 0.85);

            box-shadow: 0 14px 30px rgba(110, 50, 75, 0.15);
        }

        .button:active {
            transform: translateY(-1px);
        }

        .icon {
            margin-right: 8px;
        }

        /* Stopka */
        footer {
            margin-top: 45px;

            font-size: 0.85rem;
            color: #8b6474;

            animation: fadeUp 1.2s ease;
        }

        /* Animacje */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.15);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.12);
            }
        }

        /* Telefon */
        @media (max-width: 600px) {
            body {
                padding: 30px 18px;
            }

            .welcome {
                font-size: 2.1rem;
            }

            .button {
                padding: 16px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1 class="welcome">
            Dzień dobry, tu kocicadlaPana
            <span class="heart">♡</span>
        </h1>

        <p class="subtitle">
            Rozgość się ✨
        </p>

        <nav class="buttons">

            <a href="about.html" class="button">
                <span class="icon">🌸</span>
                O mnie
            </a>

            <a href="projekty.html" class="button">
                <span class="icon">🎀</span>
                Moje projekty
            </a>

            <a href="galeria.html" class="button">
                <span class="icon">🌷</span>
                Galeria
            </a>

            <a href="kontakt.html" class="button">
                <span class="icon">💌</span>
                Kontakt
            </a>

        </nav>

        <footer>
            ♡ miłego pobytu ♡
        </footer>

    </main>

</body>
</html>
