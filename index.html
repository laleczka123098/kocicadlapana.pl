<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="kocicadlaPana — zapoznaj się z moją stroną i ofertą.">

  <title>kocicadlaPana — Witaj w moim świecie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #050306;
      --black-2: #0d0509;
      --burgundy: #25040f;
      --wine: #48091d;
      --wine-2: #67132e;
      --rose-dark: #65152c;
      --rose: #a52e52;
      --rose-light: #ed8eac;
      --pink: #ffc3d5;
      --gold-dark: #9b7040;
      --gold: #d4ae73;
      --gold-light: #f0d39b;
      --white: #fff8fb;
      --muted: #e6ccd5;
      --glass: rgba(255,255,255,.065);
      --border: rgba(255,185,205,.18);
    }

    /* RESET */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      font-family: "Montserrat", sans-serif;
      background:
        radial-gradient(
          ellipse at 50% -10%,
          rgba(142,20,57,.42),
          transparent 45%
        ),
        radial-gradient(
          ellipse at 0% 40%,
          rgba(110,12,43,.32),
          transparent 38%
        ),
        radial-gradient(
          ellipse at 100% 70%,
          rgba(88,8,33,.36),
          transparent 40%
        ),
        linear-gradient(
          135deg,
          #030204 0%,
          #17040b 40%,
          #080307 100%
        );
    }

    /* DELIKATNA TEKSTURA */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(255,255,255,.025),
          transparent 30%
        ),
        radial-gradient(
          circle at 75% 70%,
          rgba(255,170,195,.018),
          transparent 35%
        );
    }

    /* WINIETA */

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0,0,0,.28) 76%,
          rgba(0,0,0,.72) 100%
        );
    }

    /* MENU */

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: flex-end;
      padding: 22px;
    }

    .menu {
      position: relative;
    }

    .menu-button {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(212,174,115,.28);
      border-radius: 50%;
      background: rgba(10,3,7,.72);
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    .menu-button span {
      width: 18px;
      height: 1px;
      background: var(--gold-light);
      transition: .3s ease;
    }

    .menu-content {
      position: absolute;
      top: 58px;
      right: 0;
      width: 190px;
      padding: 10px;
      border: 1px solid rgba(212,174,115,.22);
      border-radius: 18px;
      background: rgba(12,3,8,.96);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0,0,0,.55);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s ease;
    }

    .menu:hover .menu-content,
    .menu:focus-within .menu-content {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-content a {
      display: block;
      padding: 12px 14px;
      color: var(--white);
      text-decoration: none;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .04em;
      transition:
        background .25s ease,
        color .25s ease;
    }

    .menu-content a:hover {
      color: var(--gold-light);
      background: rgba(255,255,255,.055);
    }

    /* ŚWIATŁA W TLE */

    .lights {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .light {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: .42;
      animation:
        lightMove 18s ease-in-out infinite alternate,
        lightBreath 11s ease-in-out infinite;
    }

    .light.one {
      width: 420px;
      height: 420px;
      top: -160px;
      left: -100px;
      background: rgba(145,20,60,.48);
    }

    .light.two {
      width: 350px;
      height: 350px;
      top: 25%;
      right: -130px;
      background: rgba(116,10,46,.50);
      animation-delay: -6s, -3s;
      animation-duration: 23s, 13s;
    }

    .light.three {
      width: 300px;
      height: 300px;
      bottom: -80px;
      left: 35%;
      background: rgba(168,30,73,.25);
      animation-delay: -10s, -5s;
      animation-duration: 20s, 12s;
    }

    .light.four {
      width: 180px;
      height: 180px;
      top: 35%;
      left: 48%;
      background: rgba(238,191,117,.12);
      filter: blur(65px);
      animation-duration: 15s, 9s;
    }

    @keyframes lightMove {
      from {
        transform: translate3d(0,0,0) scale(1);
      }
      to {
        transform: translate3d(35px,-25px,0) scale(1.10);
      }
    }

    @keyframes lightBreath {
      0%, 100% {
        opacity: .30;
      }
      50% {
        opacity: .50;
      }
    }

    /* RÓŻE */

    .flowers {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .rose {
      position: absolute;
      width: 300px;
      height: 300px;
      opacity: .17;
      filter: drop-shadow(0 0 35px rgba(120,15,43,.45));
      animation: roseFloat 14s ease-in-out infinite alternate;
    }

    .rose::before,
    .rose::after {
      content: "";
      position: absolute;
      width: 145px;
      height: 145px;
      border-radius: 55% 45% 60% 40%;
      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,154,181,.25),
          rgba(115,11,40,.30) 45%,
          rgba(24,2,9,.05) 75%
        );
      border: 1px solid rgba(237,110,146,.14);
      box-shadow: inset 0 0 35px rgba(0,0,0,.35);
    }

    .rose::before {
      left: 10px;
      top: 70px;
      transform: rotate(-35deg);
    }

    .rose::after {
      right: 10px;
      top: 55px;
      transform: rotate(40deg);
    }

    .rose-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 110px;
      height: 110px;
      transform: translate(-50%,-50%) rotate(45deg);
      border-radius: 55% 45% 55% 45%;
      background:
        radial-gradient(
          circle at 40% 35%,
          rgba(255,186,205,.28),
          rgba(118,13,43,.42) 45%,
          rgba(26,2,10,.25) 78%
        );
      border: 1px solid rgba(238,126,157,.18);
      box-shadow:
        0 0 45px rgba(122,15,46,.20),
        inset 0 0 30px rgba(0,0,0,.35);
    }

    .rose-center::before,
    .rose-center::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 60% 40% 60% 40%;
      border: 1px solid rgba(255,173,198,.15);
    }

    .rose-center::after {
      inset: 38px;
      background:
        radial-gradient(
          circle,
          rgba(255,179,201,.18),
          transparent 70%
        );
    }

    .rose-a {
      left: -125px;
      top: 10%;
      transform: rotate(-18deg) scale(1.2);
    }

    .rose-b {
      right: -130px;
      top: 34%;
      transform: rotate(27deg) scale(1.45);
      animation-delay: -5s;
    }

    .rose-c {
      left: -100px;
      bottom: 3%;
      transform: rotate(18deg) scale(.95);
      opacity: .11;
      animation-delay: -8s;
    }

    .rose-d {
      right: -90px;
      bottom: -60px;
      transform: rotate(-24deg) scale(1.1);
      opacity: .12;
      animation-delay: -11s;
    }

    @keyframes roseFloat {
      from {
        transform: translate3d(0,0,0) rotate(-8deg) scale(1);
      }
      to {
        transform: translate3d(22px,-16px,0) rotate(5deg) scale(1.05);
      }
    }

    /* SERDUSZKA */

    .hearts {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      color: rgba(255,157,188,.48);
      font-family: Arial, sans-serif;
      text-shadow:
        0 0 7px rgba(255,135,171,.40),
        0 0 20px rgba(209,54,105,.28);
      opacity: 0;
      animation: heartFloat linear infinite;
    }

    .heart.small {
      font-size: 12px;
    }

    .heart.medium {
      font-size: 18px;
    }

    .heart.large {
      font-size: 25px;
      color: rgba(237,125,161,.32);
    }

    .heart.h1 {
      left: 5%;
      animation-duration: 17s;
      animation-delay: 1s;
    }

    .heart.h2 {
      left: 13%;
      animation-duration: 22s;
      animation-delay: 6s;
    }

    .heart.h3 {
      left: 24%;
      animation-duration: 18s;
      animation-delay: 3s;
    }

    .heart.h4 {
      left: 37%;
      animation-duration: 24s;
      animation-delay: 9s;
    }

    .heart.h5 {
      left: 49%;
      animation-duration: 19s;
      animation-delay: 4s;
    }

    .heart.h6 {
      left: 61%;
      animation-duration: 23s;
      animation-delay: 11s;
    }

    .heart.h7 {
      left: 72%;
      animation-duration: 18s;
      animation-delay: 2s;
    }

    .heart.h8 {
      left: 83%;
      animation-duration: 25s;
      animation-delay: 7s;
    }

    .heart.h9 {
      left: 94%;
      animation-duration: 16s;
      animation-delay: 12s;
    }

    @keyframes heartFloat {
      0% {
        opacity: 0;
        transform: translate3d(0,0,0) rotate(-8deg) scale(.65);
      }
      12% {
        opacity: .52;
      }
      50% {
        transform: translate3d(24px,-50vh,0) rotate(7deg) scale(.95);
      }
      78% {
        opacity: .20;
      }
      100% {
        opacity: 0;
        transform: translate3d(-20px,-115vh,0) rotate(-12deg) scale(1.08);
      }
    }

    /* ŚWIATEŁKA */

    .sparkles {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

      position:
